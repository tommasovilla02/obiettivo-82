<style>

:root{
  --bg:#f2f5f1; --surface:#ffffff; --sunk:#e9eee9; --ink:#15201a; --muted:#5a6a61; --line:#d9e1da;
  --accent:#1c7a4b; --accent-ink:#ffffff; --accent-soft:#e0f0e6;
  --cal:#b86e00; --cal-soft:#fbeed3; --vir:#17171c; --vir-ink:#ffffff; --vir-soft:#e6e6ea;
  --free:#bf3d59; --free-soft:#fbe3e8;
  --mp:#2c6bcf; --mc:#b86e00; --mf:#b3446a; --mfb:#1c7a4b;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1411; --surface:#171f1a; --sunk:#1f2923; --ink:#e7efe9; --muted:#98a89e; --line:#2a362e;
  --accent:#4cc38a; --accent-ink:#06140c; --accent-soft:#1a3326;
  --cal:#f0b24a; --cal-soft:#39290d; --vir:#ececf2; --vir-ink:#111418; --vir-soft:#2a2c33;
  --free:#f08a9f; --free-soft:#3a1922;
  --mp:#82b2ff; --mc:#f0b24a; --mf:#f08ab0; --mfb:#4cc38a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1411; --surface:#171f1a; --sunk:#1f2923; --ink:#e7efe9; --muted:#98a89e; --line:#2a362e;
  --accent:#4cc38a; --accent-ink:#06140c; --accent-soft:#1a3326;
  --cal:#f0b24a; --cal-soft:#39290d; --vir:#ececf2; --vir-ink:#111418; --vir-soft:#2a2c33;
  --free:#f08a9f; --free-soft:#3a1922;
  --mp:#82b2ff; --mc:#f0b24a; --mf:#f08ab0; --mfb:#4cc38a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:10px 0}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.count{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.tabs{display:flex;width:100%;gap:4px}
.tabs a{flex:1;text-align:center;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.wrap{padding-block:16px 48px}
.piano{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.piano{grid-template-columns:340px minmax(0,1fr);align-items:start}.calbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* calendario */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{font-size:18px;flex:1;text-transform:capitalize}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:38px;height:38px;padding:0 10px;font-weight:600}
.ib:disabled{opacity:.35;cursor:default}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.dc{border:1px solid transparent;background:var(--sunk);border-radius:10px;height:46px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:14px}
.dc.off{background:transparent;color:var(--muted);opacity:.45;cursor:default}
.dc.today{border-color:var(--accent)}
.dc.sel{background:var(--accent);color:var(--accent-ink)}
.dc.grad:not(.sel){background:var(--accent-soft)}
.dots{display:flex;gap:3px;height:7px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.c{background:var(--cal)}.dot.v{background:var(--vir)}.dot.f{background:var(--free)}
.dc.sel .dot{outline:1.5px solid var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* giorno */
.day{display:grid;gap:12px;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 104px)}
.dayhead h1{font-size:26px;line-height:1.1;text-transform:capitalize}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip.c{background:var(--cal-soft);color:var(--cal)}
.chip.v{background:var(--vir);color:var(--vir-ink)}
.chip.f{background:var(--free-soft);color:var(--free)}
.chip.g{background:var(--accent-soft);color:var(--accent)}
.notes{display:grid;gap:6px;font-size:14px}
.notes p{padding-left:12px;border-left:3px solid var(--accent)}
.notes p.warn{border-color:var(--free)}
details.setup>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.setup>summary::-webkit-details-marker{display:none}
details.setup>summary::after{content:"Modifica";color:var(--accent);font-size:13px}
details.setup[open]>summary::after{content:"Chiudi"}
.sgrid{display:grid;gap:12px;margin-top:12px}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.srow>.lab{width:96px;font-size:13px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
input[type=time],input[type=date],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;min-height:38px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:13.5px}
/* totali */
.tot{display:grid;gap:12px}
.totk{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.totk strong{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.totk span{color:var(--muted);font-size:13.5px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bar .bl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar .bv{font-weight:600;font-size:14px}
.bar .bt{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar .bt i{display:block;height:100%;border-radius:3px}
/* pasti */
.meal{padding:0;overflow:hidden}
.meal.done{opacity:.62}
.mh{display:flex;gap:12px;padding:12px 14px 8px;align-items:flex-start}
.mt{font-family:var(--display);font-weight:700;font-size:15px;min-width:52px;color:var(--accent);padding-top:1px}
.mh .mid{flex:1;min-width:0}
.slot{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mh h3{font-size:17px;line-height:1.2;margin-top:1px}
.mk{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.mk small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:11.5px;display:block;text-align:right}
.items{list-style:none;margin:0;padding:0 14px}
.items li{padding:7px 0;border-top:1px solid var(--line)}
.r1{display:flex;justify-content:space-between;gap:10px}
.r1 .fn{font-weight:500;min-width:0}
.r1 .q{white-space:nowrap;font-weight:600;text-align:right}
.r2{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 10px;margin-top:1px}
.r2 b{font-weight:600;color:var(--ink)}
.mp{color:var(--mp)}.mc{color:var(--mc)}.mf{color:var(--mf)}.mfb{color:var(--mfb)}
.msum{margin:0 14px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:2px 14px;font-weight:600}
.meal details{margin:0 14px;border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}
.meal details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.meal details p{margin-top:6px;color:var(--muted)}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px 12px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.freebox{padding:4px 14px 12px;font-size:14px;color:var(--muted)}
.chg{display:grid;gap:6px;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk)}
.chg button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px}
.chg button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.ed{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:12px}
.edh{font-size:14px;font-weight:600}
.erows{list-style:none;margin:0;padding:0}
.erows li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.erows .fn{flex:1;min-width:120px;font-size:14px}
.eq{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.eq input{width:70px;text-align:right;color:var(--ink)}
.ib.sm{min-width:34px;height:34px;padding:0}
.edt{font-size:14px}
.pgl{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:5px}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;text-align:left}
.pc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.man{display:flex;flex-wrap:wrap;gap:6px}
.man input{min-width:0;flex:1 1 90px}
.man input[type=text]{flex:2 1 140px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;min-height:38px}
.chat{display:grid;gap:6px}
.bub{max-width:88%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.4}
.bub.bot{background:var(--sunk);justify-self:start;border-bottom-left-radius:4px}
.bub.me{background:var(--accent);color:var(--accent-ink);justify-self:end;border-bottom-right-radius:4px}
.chatf{display:flex;gap:6px}
.chatf input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;min-height:42px;font-size:16px}
.pkd summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:13.5px}
.pkd .pg{margin-top:10px}
.eda{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.mfoot .fb{display:flex;gap:6px;flex-wrap:wrap}
.xbtn{justify-self:start}
/* spesa */
.sec h2{font-size:22px}
.sub{color:var(--muted);font-size:14px;margin-top:4px;max-width:65ch}
.wk{display:flex;align-items:center;gap:8px;margin:14px 0}
.wk strong{flex:1;text-align:center;font-family:var(--display);font-size:16px}
.shopcat{margin-top:12px}
.shopcat h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.shop{list-style:none;margin:0;padding:0}
.shop li{border-top:1px solid var(--line)}
.shop label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;cursor:pointer}
.shop input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.shop .sn{flex:1;min-width:0}
.shop .sn small{display:block;color:var(--muted);font-size:12px}
.shop .sq{font-weight:600;white-space:nowrap;text-align:right}
.shop li.got .sn,.shop li.got .sq{text-decoration:line-through;color:var(--muted)}
textarea.copy{width:100%;min-height:160px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px;font:13px/1.4 var(--body)}
/* peso */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.tile span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block}
.tile strong{font-family:var(--display);font-size:24px;font-weight:800}
.chart svg{display:block;width:100%;height:auto}
.wform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.wform input[type=number]{width:96px}
.wlist{list-style:none;margin:10px 0 0;padding:0}
.wlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
/* guida */
.guide{display:grid;gap:12px;max-width:720px}
.guide h3{font-size:17px;margin-bottom:6px}
.guide ul{margin:0;padding-left:18px;display:grid;gap:5px}
.guide .card p+p{margin-top:6px}
.sync{font-size:12px;color:var(--muted);margin-top:18px}
.empty{color:var(--muted);padding:10px 0}
@media (max-width:420px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}.mt{min-width:46px}.dayhead h1{font-size:23px}}
@media (prefers-reduced-motion:no-preference){.bar .bt i{transition:width .25s}}
</style>

    const j=await sampleFn.json(`Associa ogni voce all'alimento più simile di questo elenco (id: nome), solo se è davvero un sostituto ragionevole, altrimenti id null. Elenco: ${list}. Rispondi solo con JSON nella forma {"voci":[{"t":"voce originale","id":"id oppure null"}]}. Voci: ${JSON.stringify(unk)}`,{modelTier:'quick'});
    const done=[];for(const v of (j&&j.voci)||[]){if(typeof v.id==='string'&&F[v.id]&&F[v.id].cat!=='xp'){addItem(v.id,defG(v.id));done.push(v.t)}}

 if(unk.length)msg+=(msg?' ':'')+(ate?`Non ho riconosciuto «${unk.join('», «')}»: riscrivilo in un altro modo oppure con le calorie, per esempio «${unk[0]} 300 kcal».`:`Non ho in elenco «${unk.join('», «')}»: non posso usarlo per comporre il pasto.`);

 my.chat.push({w:'bot',t:msg});if(ed===my){render();const el=$('#chat-in');if(el)el.focus()}}

 for(const id in agg){const f=F[id];let name=f.n,g=agg[id],q;

 return by}

function guidaHTML(){return `<section class="sec guide"><div><h2>Come funziona il piano</h2><p class="sub">Tutti i numeri sono stime calcolate da altezza, peso, età e attività che mi hai indicato. Non sostituiscono la tua nutrizionista: se riprendi le visite, portale questo schema.</p></div>
 <div class="card"><h3>I numeri</h3><ul>
  <li>Consumi circa 2.600-2.700 kcal al giorno. Il piano ne prevede circa 2.000 nei giorni normali e 2.200 nei giorni di calcetto.</li>
  <li>Ritmo atteso: 0,5-0,8 kg a settimana, più circa 1 kg di liquidi nei primi giorni. Per la laurea vuol dire 82-83 kg.</li>
  <li>Proteine tra 130 e 145 g al giorno: servono a perdere grasso e non muscolo, e a tenere a bada la fame.</li>
  <li>Dopo la laurea il calendario continua con lo stesso schema fino a maggio, partite della Virtus comprese.</li></ul></div>
 <div class="card"><h3>Le regole che contano di più</h3><ul>
  <li>Tutti i pesi sono a crudo e al netto degli scarti. Pasta, riso e farro si pesano prima di cuocerli.</li>
  <li>L’olio si misura sempre: 1 cucchiaio sono 10 g e circa 90 kcal. Si cuoce senza olio e lo si aggiunge a crudo.</li>
  <li>Verdure non amidacee libere: insalata, finocchi, zucchine, spinaci, broccoli. Se ne vuoi di più, prendine.</li>
  <li>Acqua, almeno 2 litri. Tè e caffè senza zucchero. Bibite zuccherate e succhi fuori dal piano.</li>
  <li>Alcol solo nel pasto libero: una birra media vale circa 200 kcal.</li>
  <li>Biscotti e croissant non spariscono: i Galletti sono dentro una delle colazioni, contati.</li></ul></div>
 <div class="card"><h3>Quando la giornata va diversamente</h3><ul>
  <li>Ogni pasto ha il pulsante «Cambia pasto» con tre strade: un’altra proposta del piano, «Ho questi alimenti», «Ho mangiato altro».</li>
  <li>«Ho questi alimenti»: scrivi in chat quello che hai in casa o al lavoro e il pasto viene composto con quelli, con le grammature calcolate sulle calorie e le proteine previste.</li>
  <li>«Ho mangiato altro»: scrivi in chat cosa hai mangiato davvero, anche fuori piano («2 pizzette e una birra») o con le sole calorie («tiramisù 350 kcal»). I pasti che restano si ricalcolano.</li>
  <li>Se hai mangiato di più, il piano toglie prima il jolly e poi riduce pane, pasta, riso e condimenti, mai sotto la metà e senza toccare proteine e verdure. Quello che avanza non si recupera il giorno dopo.</li>
  <li>In fondo alla giornata c’è anche «Ho mangiato qualcosa fuori dai pasti» per gli extra.</li></ul></div>
 <div class="card"><h3>Se hai fame fuori pasto</h3><ul>
  <li>Prima un bicchiere d’acqua o una tisana, poi aspetta dieci minuti.</li>
  <li>Verdure crude: finocchi, carote, pomodorini.</li>
  <li>Uno yogurt greco 0% o uno skyr bianco (circa 90 kcal, 15-17 g di proteine).</li>
  <li>Un frutto. Evita le cose da scaldare al microonde prese al volo.</li></ul></div>
 <div class="card"><h3>Calcetto</h3><ul>
  <li>Partita entro le 20:00: merenda di carboidrati due ore prima, cena completa dopo.</li>
  <li>Partita dalle 20:30 in poi: cena leggera ma completa in anticipo, yogurt e frutta dopo.</li>
  <li>Non giocare a stomaco vuoto e non saltare la cena dopo: è lì che recuperi.</li>
  <li>Se cambia giorno o orario, modificalo dalla scheda del giorno: i pasti si ricalcolano.</li></ul></div>
 <div class="card"><h3>Sere di partita Virtus</h3><ul>
  <li>Palla a due dalle 19:30 in poi, scegli tu dalla scheda del giorno: cena circa due ore prima e spuntino proteico a fine lavoro, oppure spuntino prima e cena a fine partita.</li>
  <li>Il pranzo dei giorni di partita può essere al lavoro o a casa: si cambia dalla scheda del giorno.</li>
  <li>Al lavoro niente pane: i carboidrati sono gallette di riso, da 3 a 6 secondo il pasto (una galletta pesa circa 8 g).</li>
  <li>Partita nel pomeriggio: spuntino sostanzioso prima, cena normale a casa dopo.</li>
  <li>Al bar del palazzetto, se serve: toast o piadina con crudo o bresaola, acqua. Niente fritti e niente seconda pizzetta.</li></ul></div>
 <div class="card"><h3>Pasto libero</h3><ul>
  <li>Uno a settimana, un pasto e non un giorno intero. È segnato di default il sabato sera.</li>
  <li>Se la cena fuori capita un altro giorno, spostalo lì dalla scheda del giorno e toglilo dal sabato.</li>
  <li>Il giorno dopo si riparte dal piano, senza digiuni di compensazione.</li></ul></div>
 <div class="card"><h3>Movimento</h3><ul>
  <li>Due calcetti a settimana sono già una buona base.</li>
  <li>Quando riesci, aggiungi una o due uscite da 30-40 minuti di corsa lenta o camminata veloce.</li>
  <li>Nei giorni pieni basta camminare: scale, un tratto a piedi, 8.000 passi come riferimento.</li></ul></div>
 <div class="card"><h3>Da dove vengono i valori</h3><p>Calorie e macronutrienti sono valori medi per 100 g di alimento. Per i prodotti confezionati fa fede l’etichetta: in particolare l’insalata Bonduelle è stimata su una confezione da 160 g con il suo condimento.</p></div></section>`}

/* --- render e routing --- */
function view(){const h=location.hash.replace('#','');return['piano','spesa','peso','guida'].includes(h)?h:'piano'}
function render(){const v=view();
 document.querySelectorAll('#tabs a').forEach(a=>{if(a.getAttribute('href')==='#'+v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 const left=diffD(clampD(todayStr()),GRAD);
 $('#count').textContent=left>0?`${left} giorni alla laurea`:(left>=-1?'Laurea':'Piano di mantenimento');
 $('#view').innerHTML=v==='piano'?pianoHTML():v==='spesa'?spesaHTML():v==='peso'?pesoHTML():guidaHTML()}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.act;
 if(a==='day'){sel=b.dataset.d;setupOpen=false;ed=null;menu=null;render();if(innerWidth<900){const el=$('#day');if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}}
 else if(a==='mon'){const[y,m]=month.split('-').map(Number),t=new Date(Date.UTC(y,m-1+(+b.dataset.n),1));month=t.toISOString().slice(0,7);render()}
 else if(a==='today'){sel=clampD(todayStr());month=sel.slice(0,7);render()}
 else if(a==='set'){setupOpen=true;const k=b.dataset.k,v=b.dataset.v,e=events(sel,ov(sel));
  if(k==='lunch')setOv(sel,{lunch:v});
  else if(k==='vd')setOv(sel,{vd:v});
  else if(k==='free')setOv(sel,{free:v});
  else if(k==='cal')setOv(sel,{cal:v==='on'?(e.cal||CALCETTO[sel]||'20:00'):false});
  else if(k==='vir')setOv(sel,{vir:v==='on'?(e.vir||(VIRTUS[sel]&&VIRTUS[sel][0])||'20:30'):false})}
 else if(a==='reset'){ed=null;menu=null;delete S.days[sel];commit('days');render()}
 else if(a==='swap'){menu=null;const o=ov(sel),sw={...(o.sw||{})};sw[b.dataset.s]=(sw[b.dataset.s]||0)+1;setOv(sel,{sw})}
 else if(a==='chg'){menu=menu===b.dataset.s?null:b.dataset.s;ed=null;render()}
 else if(a==='have'||a==='ate'){const s=b.dataset.s,c=(ov(sel).cm||{})[s];menu=null;
  ed={slot:s,mode:a,sel:c&&c.m===a?c.i.filter(x=>F[x[0]]).map(x=>[x[0],x[1]]):[],man:c&&c.m===a?(c.x||[]).map(x=>({...x})):[],d:{},po:false,chat:[{w:'bot',t:INTRO[a]}]};
  if(ed.sel.length||ed.man.length)ed.chat.push({w:'bot',t:'Qui sotto trovi quello che avevi già segnato.'});render()}
 else if(a==='pick'&&ed){const id=b.dataset.id,i=ed.sel.findIndex(x=>x[0]===id);if(i>=0)ed.sel.splice(i,1);else ed.sel.push([id,defG(id)]);render()}
 else if(a==='stp'&&ed){const x=ed.sel.find(x=>x[0]===b.dataset.id);if(x){const st=bnd(x[0])[2];x[1]=Math.max(0,Math.round((x[1]+st*(+b.dataset.n))*10)/10);render()}}
 else if(a==='mdel'&&ed){ed.man.splice(+b.dataset.i,1);render()}
 else if(a==='edx'){ed=null;render()}
 else if(a==='edok'&&ed){const o=ov(sel),cm={...(o.cm||{})},done={...(o.done||{})},s=ed.slot;
  const items=ed.sel.filter(x=>x[1]>0);
  if(!items.length&&!ed.man.length){const el=$('#edmsg');el.hidden=false;el.textContent=ed.mode==='ate'?'Scegli almeno un alimento.':'Scegli almeno un alimento tra quelli che hai.';return}
  if(ed.mode==='have'){const base=buildDay(sel,{...o,cm:undefined,done:undefined}).meals.find(m=>m.slot===s);
   cm[s]={m:'have',i:compose(items.map(x=>x[0]),base?base.t:{k:500,p:30},s)}}
  else{cm[s]={m:'ate',i:items,x:ed.man};if(s!=='extra')done[s]=1}
  ed=null;setOv(sel,{cm,done:Object.keys(done).length?done:undefined})}
 else if(a==='back'){const o=ov(sel),cm={...(o.cm||{})},done={...(o.done||{})},s=b.dataset.s;delete cm[s];delete done[s];
  setOv(sel,{cm:Object.keys(cm).length?cm:undefined,done:Object.keys(done).length?done:undefined})}
 else if(a==='wk'){shopWeek=addD(shopWeek,7*(+b.dataset.n));render()}
 else if(a==='wdel'){delete S.weights[b.dataset.d];commit('weights');render()}
 else if(a==='copy'){const done=()=>{$('#copied').textContent='Copiata: incollala in un messaggio.'};
  const fb=()=>{const t=$('#copybox');t.hidden=false;t.value=copyText;t.focus();t.select();$('#copied').textContent='Seleziona il testo qui sotto e copialo.'};
  try{navigator.clipboard.writeText(copyText).then(done,fb)}catch(e){fb()}}
});
document.addEventListener('input',ev=>{const t=ev.target;if(!ed)return;
 if(t.dataset.d)ed.d[t.dataset.d]=t.value;
 else if(t.dataset.g){const x=ed.sel.find(x=>x[0]===t.dataset.g),v=parseFloat(String(t.value).replace(',','.'));if(x){x[1]=v>0&&v<=3000?v:0;const el=$('#edtot');if(el)el.textContent=edTotal()}}});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.type==='time'&&t.dataset.k){if(t.value){setupOpen=true;setOv(sel,{[t.dataset.k]:t.value})}}
 else if(t.dataset.act==='done'){const o=ov(sel),done={...(o.done||{})};if(t.checked)done[t.dataset.s]=1;else delete done[t.dataset.s];setOv(sel,{done:Object.keys(done).length?done:undefined})}
 else if(t.dataset.act==='shop'){if(t.checked)S.shop[t.dataset.key]=1;else delete S.shop[t.dataset.key];commit('shop');render()}
});
document.addEventListener('toggle',ev=>{if(ev.target.id==='setup')setupOpen=ev.target.open;else if(ev.target.id==='pkd'&&ed)ed.po=ev.target.open},true);
document.addEventListener('submit',ev=>{if(ev.target.id==='chatf'){ev.preventDefault();chatSend();return}
 if(ev.target.id!=='wform')return;ev.preventDefault();
 const d=$('#w-date').value,k=parseFloat(String($('#w-kg').value).replace(',','.'));
 if(!d||d<START||!(k>=50&&k<=150))return;S.weights[d]=Math.round(k*10)/10;commit('weights');render()});
render();
</script>
